<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收银台 - {{ product['name'] }}</title>
  <style>
    :root {
      --bg: #faf9f6;
      --ink: #141413;
      --muted: #6b6a66;
      --accent: #c96442;
      --line: #e7e3dc;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }
    .wrap { width: 100%; max-width: 420px; }
    .brand { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .brand b { color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 16px rgba(20,20,19,.04);
    }
    .name { font-size: 19px; font-weight: 700; text-align: center; line-height: 1.4; }
    .desc { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }
    .price { text-align: center; font-size: 34px; font-weight: 800; color: var(--accent); margin: 18px 0 4px; }
    .price small { font-size: 18px; font-weight: 700; }
    .divider { height: 1px; background: var(--line); margin: 20px 0; }
    .qr-label { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .qr-box {
      display: flex; justify-content: center; align-items: center;
      min-height: 220px; padding: 12px;
      border: 1px dashed var(--line); border-radius: 12px; background: #fff;
    }
    .qr-box img { width: 200px; height: 200px; }
    .qr-box form, .qr-box iframe { margin: 0; border: 0; }
    .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
    .status { text-align: center; font-size: 14px; margin-top: 16px; min-height: 20px; }
    .status.paid { color: #2e7d32; font-weight: 600; }
    .status.expired { color: var(--accent); font-weight: 600; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: 6px;
      border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><b>ipengAI</b> · 安全收银台</div>
    <div class="card">
      <div class="name">{{ product['name'] }}</div>
      <div class="desc">{{ product['description'] }}</div>
      <div class="price"><small>¥</small>{{ '%.2f' | format(product['price']) }}</div>
      <div class="divider"></div>
      <div class="qr-label">请使用「支付宝」扫一扫完成支付</div>
      <div class="qr-box" id="qrBox">
        {% if qr_code %}
          <img src="{{ qr_code }}" alt="支付宝二维码">
        {% elif form_html %}
          <iframe id="qrFrame" width="200" height="200" frameborder="0"
                  scrolling="no" style="border:none;overflow:hidden;"></iframe>
        {% else %}
          <span style="color:var(--muted)">二维码生成中…</span>
        {% endif %}
      </div>
      <div class="status" id="status"><span class="spinner"></span>正在等待支付…</div>
      <div class="hint">支付完成后本页将自动跳转至下载页，无需手动操作。</div>
    </div>
    <div class="foot">虚拟资料 · 支付成功后不支持无理由退款 · 下载异常可联系补发</div>
  </div>

  <script>
    // 将支付宝 form_html 写入 iframe 内部文档，隔离其自动提交脚本，
    // 避免脚本在当前页面执行导致整页跳转到支付宝二维码页（全屏弹窗）。
    {% if form_html %}
    (function () {
      var html = {{ form_html | tojson }};
      var frame = document.getElementById('qrFrame');
      if (frame) {
        var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
        if (doc) {
          doc.open();
          doc.write(html);
          doc.close();
        }
      }
    })();
    {% endif %}
  </script>

  <script>
    (function () {
      var pollUrl = "{{ poll_url }}";
      var deliveryUrl = "{{ delivery_url }}";
      var statusEl = document.getElementById('status');
      var startTs = Date.now();
      var timer = null;

      function setStatus(text, cls) {
        statusEl.className = 'status' + (cls ? ' ' + cls : '');
        if (cls === 'paid') {
          statusEl.innerHTML = '✅ 支付成功，正在跳转…';
        } else if (cls === 'expired') {
          statusEl.innerHTML = '⏰ 二维码已过期，请刷新页面重新获取';
        } else {
          statusEl.innerHTML = '<span class="spinner"></span>' + text;
        }
      }

      function poll() {
        fetch(pollUrl, { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.payment_status === 'paid') {
              clearInterval(timer);
              setStatus('', 'paid');
              setTimeout(function () { window.location.href = deliveryUrl; }, 800);
              return;
            }
            // 10 分钟超时（与支付宝二维码有效期一致）
            if (Date.now() - startTs > 10 * 60 * 1000) {
              clearInterval(timer);
              setStatus('', 'expired');
              return;
            }
            setStatus('正在等待支付…');
          })
          .catch(function () { setStatus('正在等待支付…'); });
      }

      timer = setInterval(poll, 2000);
      poll();
    })();
  </script>
</body>
</html>
